use_stop_pose: False
left_num_waypoints: 6
right_num_waypoints: 4
straight_num_waypoints: 3
visualization: True
speed: 0.2

canonical_goal_pose_right: {
  x: 0.2,
  y: -0.3,
  theta: -1.57,
}

canonical_goal_pose_left: {
  x: 0.4,
  y: 0.5,
  theta: 1.57,
}

canonical_goal_pose_straight: {
  x: 0.6,
  y: 0.0,
  theta: 0.0,
}

# Left turn via point: intermediate waypoint to avoid cutting into opposite lane
# The robot will go forward to this point before beginning the left turn
left_turn_via_point: {
  x: 0.25,      # Go forward 0.3m into the intersection
  y: 0.0,      # Stay centered (no lateral movement yet)
  theta: 0.0,  # Keep heading straight
}

# Enable/disable the via point for left turns
use_left_turn_via_point: True

# Distance offset from detected stop line (in meters)
# Positive = start trajectory after crossing stop line
# Negative = start trajectory before stop line
stop_line_offset: 0.0

# Waypoint reach thresholds per maneuver
left_x_threshold: 0.08
left_dist_threshold: 0.1
right_x_threshold: 0.08
right_dist_threshold: 0.1
straight_x_threshold: 0.08
straight_dist_threshold: 0.1

debug_dir: -1
